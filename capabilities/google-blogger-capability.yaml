        method: PUT
        description: Update a post
        inputParameters:
        - name: blogId
          in: path
          type: string
          required: true
        - name: postId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: patchpost
        method: PATCH
        description: Patch a post
        inputParameters:
        - name: blogId
          in: path
          type: string
          required: true
        - name: postId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deletepost
        method: DELETE
        description: Delete a post
        inputParameters:
        - name: blogId
          in: path
          type: string
          required: true
        - name: postId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
