naftiko: 1.0.0-alpha2
info:
  label: Google Blogger API
  description: The Blogger API v3 allows you to create, read, update, and delete Blogger resources including blogs, posts,
    pages, comments, and users. You can integrate Blogger content into your application using RESTful operations.
  tags:
  - Google
  - Blogger
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: google-blogger
    baseUri: https://www.googleapis.com/blogger/v3
    description: Google Blogger API HTTP API.
    authentication:
      type: bearer
      token: '{{GOOGLE_BLOGGER_TOKEN}}'
    resources:
    - name: blogs-blogid
      path: /blogs/{blogId}
      operations:
      - name: getblog
        method: GET
        description: Get a blog
        inputParameters:
        - name: blogId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: blogs-byurl
      path: /blogs/byurl
      operations:
      - name: getblogbyurl
        method: GET
        description: Get a blog by URL
        inputParameters:
        - name: url
          in: query
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: users-userid-blogs
      path: /users/{userId}/blogs
      operations:
      - name: listblogsbyuser
        method: GET
        description: List blogs by user
        inputParameters:
        - name: userId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: blogs-blogid-posts
      path: /blogs/{blogId}/posts
      operations:
      - name: listposts
        method: GET
        description: List posts
        inputParameters:
        - name: blogId
          in: path
          type: string
          required: true
        - name: maxResults
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
        - name: labels
          in: query
          type: string
        - name: startDate
          in: query
          type: string
        - name: endDate
          in: query
          type: string
        - name: status
          in: query
          type: string
        - name: orderBy
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: insertpost
        method: POST
        description: Create a post
        inputParameters:
        - name: blogId
          in: path
          type: string
          required: true
        - name: isDraft
          in: query
          type: boolean
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
