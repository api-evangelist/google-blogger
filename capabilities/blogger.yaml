        idempotent: true
      call: blogger.updatepost
      with:
        blogId: tools.blogId
        postId: tools.postId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: patch-post
      description: Patch a post
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: blogger.patchpost
      with:
        blogId: tools.blogId
        postId: tools.postId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-post
      description: Delete a post
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: blogger.deletepost
      with:
        blogId: tools.blogId
        postId: tools.postId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-comments
      description: List comments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: blogger.listcomments
      with:
        blogId: tools.blogId
        postId: tools.postId
        maxResults: tools.maxResults
        pageToken: tools.pageToken
      outputParameters:
      - type: object
        mapping: $.
    - name: get-comment
      description: Get a comment
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: blogger.getcomment
      with:
        blogId: tools.blogId
        postId: tools.postId
        commentId: tools.commentId
      outputParameters:
